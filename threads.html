<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin · All threads</title>
<link rel="stylesheet" href="ui.css">
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 24px 80px; }
  h1 { font: 600 32px/1.2 var(--serif); letter-spacing: -.015em; margin: 0 0 2px; }
  .meta { color: var(--faint); font-size: 13px; }

  /* Reading progress across everything, same bar as the side panel */
  .progress { margin-top: 14px; }
  .progress .bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--hover); }
  .progress .bar .d { background: var(--done); } .progress .bar .o { background: var(--open); }
  .progress .legend { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot.d { background: var(--done); } .dot.o { background: var(--open); }

  .bar-tools { position: sticky; top: 0; z-index: 1; background: var(--bg); margin: 20px -24px 0; padding: 10px 24px;
    border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .bar-tools .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar-tools .spacer { flex: 1; }
  .bar-tools .links { display: flex; gap: 2px; }
  #concept:empty { display: none; }

  /* Each page is a neutral card holding its status-coloured thread cards; a thin bar shows how far it's resolved. */
  section.page { margin-top: 24px; padding: 18px 18px 18px; border-radius: 14px; background: var(--bg-soft); box-shadow: inset 0 0 0 1px var(--line); }
  #list > section.page:first-child { margin-top: 28px; }
  .page-head { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 16px 2px; }
  .page-title { flex: 1; min-width: 0; }
  .page-head h2 { font: 600 17px/1.35 var(--serif); letter-spacing: -.01em; margin: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .page-head h2 a { text-decoration: none; } .page-head h2 a:hover { text-decoration: underline; }
  .page-head .host { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px; margin-top: 3px; }
  .mini { display: flex; gap: 2px; width: 56px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--hover); flex: none; }
  .mini .d { background: var(--done); } .mini .o { background: var(--open); }
  .page-head .icon-btn { margin: -2px -4px 0 0; }
  .icon-btn.copied { color: var(--done); }

  /* Thread cards: the side panel's, with room for the takeaway or open question */
  .cards { display: grid; gap: 10px; }
  .card { --c: var(--open); --tint: var(--open-tint); border-radius: 10px; background: var(--tint); padding: 13px 16px 12px 19px;
    box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);
    transition: transform .15s ease, box-shadow .15s ease; }
  .card.done { --c: var(--done); --tint: var(--done-tint); }
  .card:hover { transform: translateY(-1px); box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 4px 12px rgba(15,15,15,.08); }
  .card .passage { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 14px; line-height: 1.55; text-decoration: none; }
  .card .passage:hover { text-decoration: underline; text-decoration-color: var(--faint); }
  .card .meta-line { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
  .chip { font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 10px; color: var(--soft);
    background: color-mix(in srgb, var(--bg) 70%, transparent); box-shadow: inset 0 0 0 1px var(--line); }
  .chip:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--soft); }
  .chip.on { background: var(--hl-bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hl-line); }

  /* Graph: concepts are rings, threads are dots in their status colour */
  .graph-card { margin-top: 20px; border-radius: 12px; background: var(--bg-soft); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .graph-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px; font-size: 12px; color: var(--soft); border-bottom: 1px solid var(--line); }
  .ring { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; box-shadow: inset 0 0 0 1.5px var(--soft); }
  .graph { display: block; width: 100%; height: min(68vh, 620px); }
  .graph line { stroke: var(--line); stroke-width: 1.2; }
  .graph circle.open { fill: var(--open); } .graph circle.done { fill: var(--done); }
  .graph .thread:hover circle, .graph .thread:focus-visible circle { stroke: var(--ink); stroke-width: 1.5; }
  .graph .concept { cursor: pointer; outline: none; }
  .graph .concept circle { fill: var(--bg); stroke: var(--soft); stroke-width: 1.5; }
  .graph .label { cursor: pointer; fill: var(--ink); font: 600 14px var(--font); text-anchor: middle; paint-order: stroke; stroke: var(--bg-soft); stroke-width: 4px; }
  .graph .concept:hover circle, .graph .concept:focus-visible circle { stroke: var(--blue); stroke-width: 2.5; }
  .graph.focusing line:not(.lit), .graph.focusing .thread:not(.lit), .graph.focusing .concept:not(.lit), .graph.focusing .label:not(.lit) { opacity: .15; }
  .graph line.lit { stroke: var(--soft); }
  .graph-note { color: var(--faint); font-size: 12px; margin: 0; padding: 10px 14px; border-top: 1px solid var(--line); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
  @media (max-width: 520px) { .wrap { padding: 24px 16px 64px; } section.page { padding: 14px 12px; } .bar-tools { margin: 16px -16px 0; padding: 10px 16px; } h1 { font-size: 26px; } }
</style>
<div class="wrap">
  <h1>All threads</h1>
  <div class="meta" id="meta"></div>
  <div class="progress" id="progress" hidden></div>
  <div class="bar-tools">
    <input type="search" id="q" placeholder="Search passages, takeaways and comments" aria-label="Search threads">
    <div class="row">
      <div class="seg" role="group" aria-label="Filter">
        <button data-f="all" aria-pressed="true">All</button><button data-f="open" aria-pressed="false">Open</button><button data-f="resolved" aria-pressed="false">Resolved</button>
      </div>
      <div class="seg view" role="group" aria-label="View">
        <button data-v="list" aria-pressed="true">List</button><button data-v="graph" aria-pressed="false">Graph</button>
      </div>
      <span id="concept"></span>
      <span class="spacer"></span>
      <div class="links"><button class="btn plain" id="export">Export JSON</button><a class="btn plain" href="options.html">Settings</a></div>
    </div>
  </div>
  <main id="list" aria-live="polite"></main>
</div>
<script src="notes.js"></script>
<script type="module" src="threads.js"></script>
</html>
