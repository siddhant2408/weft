<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Margin · All threads</title>
<link rel="stylesheet" href="ui.css">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 4px; }
  .meta { color: var(--faint); font-size: 14px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 20px 0 8px; position: sticky; top: 0; z-index: 1;
    background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .bar input[type=search] { flex: 1; min-width: 200px; }
  .bar .links { display: flex; gap: 2px; }
  section.page { margin-top: 28px; }
  .page-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .page-head h2 { font-size: 16px; font-weight: 600; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .page-head h2 a { text-decoration: none; } .page-head h2 a:hover { text-decoration: underline; }
  .page-head .host { color: var(--faint); font-size: 13px; font-weight: 400; margin-left: 6px; }
  .item { display: block; padding: 10px 12px; margin: 0 -12px; border-radius: 8px; }
  .item:hover { background: var(--bg-soft); }
  .item .quote { font-size: 14px; color: var(--soft); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .takeaway { margin-top: 8px; font-size: 14px; }
  .item .open-q { margin-top: 6px; }
  .item .foot { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--faint); align-items: center; }
  .item .foot a { color: var(--soft); }
  .item.resolved .quote { opacity: .75; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 10px; background: var(--hover); color: var(--soft); }
  .chip:hover { background: var(--press); color: var(--ink); }
  .chip.on { background: var(--hl-bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hl-line); }
  .graph { display: block; width: 100%; height: min(72vh, 680px); margin-top: 16px; border-radius: 12px; background: var(--bg-soft); }
  .graph line { stroke: var(--line); stroke-width: 1.2; }
  .graph circle.open { fill: var(--open); } .graph circle.done { fill: var(--done); }
  .graph .thread:hover circle { stroke: var(--ink); stroke-width: 1.5; }
  .graph .concept { cursor: pointer; outline: none; }
  .graph .concept circle { fill: var(--bg); stroke: var(--soft); stroke-width: 1.5; }
  .graph .label { cursor: pointer; fill: var(--ink); font-size: 12px; font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: var(--bg-soft); stroke-width: 4px; }
  .graph .concept:hover circle, .graph .concept:focus-visible circle { stroke: var(--blue); stroke-width: 2.5; }
  .graph.focusing line:not(.lit), .graph.focusing .thread:not(.lit), .graph.focusing .concept:not(.lit), .graph.focusing .label:not(.lit) { opacity: .15; }
  .graph line.lit { stroke: var(--soft); }
  .graph-note { color: var(--faint); font-size: 13px; margin: 8px 0 0; }
  @media (max-width: 520px) { .wrap { padding: 28px 16px 64px; } h1 { font-size: 24px; } }
</style>
<div class="wrap">
  <h1>All threads</h1>
  <div class="meta" id="meta"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Search passages, takeaways, messages…" aria-label="Search threads">
    <div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="true">All</button><button data-f="open" aria-pressed="false">Open</button><button data-f="resolved" aria-pressed="false">Resolved</button>
    </div>
    <div class="seg view" role="group" aria-label="View">
      <button data-v="list" aria-pressed="true">List</button><button data-v="graph" aria-pressed="false">Graph</button>
    </div>
    <span id="concept"></span>
    <div class="links"><button class="btn plain" id="export">Export JSON</button><a class="btn plain" href="options.html">Settings</a></div>
  </div>
  <main id="list"></main>
</div>
<script src="notes.js"></script>
<script type="module" src="threads.js"></script>
</html>
