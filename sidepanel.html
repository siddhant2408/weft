<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Weft</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
  /* Chrome's own panel header already names Weft; this bar holds only the global buttons. */
  nav.top { display: flex; justify-content: flex-end; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  header h1:empty { display: none; }
  header h1 { font: 600 19px/1.3 var(--serif); letter-spacing: -.01em; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
  .sub .host { flex: 1; font-size: 12px; color: var(--faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Reading progress: how many threads have reached a takeaway */
  .progress { margin-top: 10px; }
  .progress .bar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--hover); }
  .progress .bar span { transition: flex-grow .4s ease; }
  .progress .bar .d { background: var(--done); } .progress .bar .o { background: var(--open); }
  .progress .legend { display: flex; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
  .dot.d { background: var(--done); } .dot.o { background: var(--open); }
  main { flex: 1; padding: 4px 0 8px; }

  section.block { padding: 14px 16px 6px; }
  .label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--soft); margin: 0 0 8px; }
  .label .n { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
  .label .spacer { flex: 1; }
  .label .icon-btn { width: 24px; height: 24px; margin: -4px 0; }

  /* Gist */
  .gist-card { padding: 12px 14px 8px; border-radius: 12px; background: var(--bg-soft); box-shadow: inset 0 0 0 1px var(--line); }
  .gist .tldr { font: 16px/1.5 var(--serif); margin: 0; }
  .gist .full { margin-top: 8px; font-size: 13.5px; color: var(--soft); }
  .gist .full ul { padding-left: 18px; margin: 4px 0; }
  .gist .full p:last-child { display: none; }  /* the TL;DR line, already shown above */
  .gist .more { margin: 4px 0 0 -9px; }
  .gist .warn { font-size: 12px; color: var(--red); margin-top: 4px; }
  .gist .empty-gist { display: grid; gap: 8px; justify-items: start; }
  .gist .empty-gist p { margin: 0; font-size: 13px; color: var(--soft); }

  /* Thread cards: yellow spine while open, green once resolved. Each jumps to its passage on the page. */
  .cards { display: grid; gap: 8px; }
  .card { --c: var(--open); --tint: var(--open-tint); border-radius: 10px; background: var(--tint);
    box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);
    transition: transform .15s ease, box-shadow .15s ease; }
  .card.done { --c: var(--done); --tint: var(--done-tint); }
  .card:hover { transform: translateY(-1px); box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 4px 12px rgba(15,15,15,.08); }
  .card > button { display: block; width: 100%; text-align: left; padding: 10px 12px 10px 15px; border-radius: 10px; }
  .card .meta-line { font-size: 11.5px; color: var(--faint); margin-top: -4px; padding: 0 12px 10px 15px; }
  .card > .more + .meta-line { margin-top: -2px; }
  .card .passage { font-size: 14px; line-height: 1.55; }
  .card .passage.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .card > .more { margin: -8px 0 4px 1px; font-size: 12px; }
  .card .status { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .card .status.warn { color: var(--red); }
  .hint { font-size: 13px; color: var(--faint); margin: 2px 0 6px; }

  /* Orphaned thread: no passage to jump to, so it opens here */
  .orphan { margin: 0 8px 8px 11px; padding: 8px 10px; border-radius: 8px; background: var(--bg); }
  .orphan .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }

  /* Page Q&A */
  .qa .msgs { display: grid; gap: 2px; }
  footer { position: sticky; bottom: 0; background: var(--bg); padding: 8px 12px 10px; border-top: 1px solid var(--line); }
  footer .error { margin: 0 4px 6px; }
  footer .page-del { display: flex; justify-content: center; margin-top: 6px; }
  footer .page-del .btn { font-size: 12px; padding: 1px 6px; }
  footer .confirm { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--soft); }
  @media (prefers-reduced-motion: reduce) { .card, .progress .bar span { transition: none; } .card:hover { transform: none; } }
</style>
<nav class="top" aria-label="Weft">
  <span id="global"></span>
</nav>
<header>
  <h1 id="title"></h1>
  <div class="sub"><span class="host" id="host"></span><span id="tools"></span></div>
  <div class="progress" id="progress" hidden></div>
</header>
<main id="list" aria-live="polite"></main>
<footer id="foot"></footer>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="notes.js"></script>
<script src="sidepanel.js"></script>
</html>
