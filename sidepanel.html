<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Margin</title>
<style>
  :root {
    --bg: #fafaf7; --card: #fff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #e6e4dc;
    --hl: #fff1a8; --hl-strong: #ffd84d; --accent: #8a6d00; --err: #b3261e; --err-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1b19; --card: #252522; --ink: #ecebe6; --muted: #a3a29b; --line: #3a3934;
      --hl: #4a4220; --hl-strong: #6b5d1f; --accent: #e8c84a; --err: #ffb4ab; --err-bg: #3c1f1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; background: var(--bg); padding: 12px 14px 8px; border-bottom: 1px solid var(--line); z-index: 1; }
  header h1 { font-size: 13px; margin: 0 0 2px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { padding: 10px 10px 40px; display: grid; gap: 8px; }
  .tools { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .card.summary { border-left: 3px solid var(--accent); }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin-bottom: 4px; }
  .empty { color: var(--muted); padding: 24px 8px; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .card.active { border-color: var(--hl-strong); box-shadow: 0 0 0 2px var(--hl); cursor: default; }
  .card.resolved:not(.active) { opacity: .7; }
  .quote { border-left: 3px solid var(--hl-strong); padding-left: 8px; color: var(--muted); font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .active .quote { -webkit-line-clamp: 6; }
  .badges { display: flex; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--muted); }
  .badge { border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  .badge.warn { color: var(--err); border-color: currentColor; }
  .takeaway { margin-top: 8px; font-weight: 500; }
  .takeaway::before { content: "✓ "; color: var(--accent); }
  .msgs { margin-top: 10px; display: grid; gap: 10px; }
  .msg .who { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
  .msg.assistant .who { color: var(--accent); }
  .msg.note .body { color: var(--muted); }
  .msg .body p { margin: 0 0 6px; } .msg .body p:last-child { margin-bottom: 0; }
  .msg .body pre { overflow-x: auto; background: var(--bg); padding: 6px; border-radius: 4px; }
  .msg .body ul, .msg .body ol { margin: 4px 0; padding-left: 18px; }
  .thinking { color: var(--muted); font-style: italic; }
  .error { margin-top: 10px; background: var(--err-bg); color: var(--err); padding: 8px; border-radius: 6px; }
  .error button { margin-top: 6px; }
  textarea { width: 100%; margin-top: 10px; min-height: 56px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea:focus { outline: 2px solid var(--hl-strong); outline-offset: -1px; }
  .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .row .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 11px; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--hl-strong); border-color: var(--hl-strong); color: #1f1f1f; font-weight: 600; }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
</style>
<header><h1 id="title">Margin</h1><div class="meta" id="meta"></div><div class="tools" id="tools"></div></header>
<main id="list"></main>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="notes.js"></script>
<script src="sidepanel.js"></script>
</html>
